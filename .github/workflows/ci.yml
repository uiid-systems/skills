name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Pinned so a Claude Code release never changes what CI checks without a
      # PR here. validate and test run offline and need no API key.
      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@2.1.332

      - name: Validate manifests and skills
        run: claude plugin validate .

      - name: Test the uiid plugin
        run: claude plugin test plugins/uiid

      - name: Check formatting
        run: pnpm format:check
